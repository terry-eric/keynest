[platformio]
src_dir = main

[env:pcb2_s3]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    main/web/index.html
    main/web/app.js
    main/web/style.css
monitor_speed = 115200
