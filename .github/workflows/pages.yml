name: Deploy KeyNest to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - web-console/**
      - firmware/keyboard/main/web/**
      - tools/build-web-console.py
      - tools/test-web-console-build.py
      - tools/test-actions.cjs
      - tools/test-studio.cjs
      - tools/test-connection-view.cjs
      - tools/test-web-serial.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Check the maintained console
        run: |
          python tools/test-web-console-build.py
          node tools/test-actions.cjs
          node tools/test-studio.cjs
          node tools/test-connection-view.cjs
          node tools/test-web-serial.cjs
      - name: Build the same USB console for the repository URL
        run: python tools/build-web-console.py --out .tools/github-pages --base-path keynest
      - name: Upload only the public console assets
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .tools/github-pages/keynest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
